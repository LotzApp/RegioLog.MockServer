spring.application.name=mockApi
server.port=3131

#spring.datasource.url=jdbc:h2:file:./testdb;AUTO_SERVER=TRUE
spring.datasource.url=jdbc:mysql://localhost:3306/app_db
#spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create-drop
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.enabled=true

spring.data.rest.base-path=
spring.jpa.show-sql=false
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=TRACE
logging.level.org.springframework.transaction=OFF
logging.level.sql=off

spring.jpa.open-in-view=false