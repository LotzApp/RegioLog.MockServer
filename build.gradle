plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lotzapp.mock'
version = '0.0.1-SNAPSHOT'
description = 'MockApi for LotzApp'

resolveMainClassName {

}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven {
		name "nexus"
		url = uri(property("nexusUrl") as String)
		credentials {
			username = property("nexusUsername") as String
			password = property("nexusPassword") as String
		}
	}
}

dependencies {
	implementation("org.lotzapp:adminapi:1.0.43")
	implementation("org.lotzapp:mockapi:1.0.43")
	implementation("org.lotzapp:regiologapi:1.0.43")

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-aop'

    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5")
    //implementation("javax.validation:validation-api:2.0.1.Final")
    //implementation("javax.annotation:javax.annotation-api:1.3.2")
    implementation("org.openapitools:jackson-databind-nullable:0.2.8")
	//implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
	compileOnly 'org.projectlombok:lombok'
    // https://mvnrepository.com/artifact/javax.servlet/javax.servlet-api
    //compileOnly("javax.servlet:javax.servlet-api:4.0.1")
	runtimeOnly 'com.h2database:h2'
	implementation 'com.mysql:mysql-connector-j:8.3.0'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

